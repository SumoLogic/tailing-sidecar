version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:27"
      timezone: "Europe/Warsaw"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"

  - package-ecosystem: "docker"
    directory: "/operator"
    schedule:
      interval: "daily"
      time: "06:27"
      timezone: "Europe/Warsaw"
    groups:
      docker-base-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"

  - package-ecosystem: "docker"
    directory: "/sidecar/otelcol"
    schedule:
      interval: "daily"
      time: "06:27"
      timezone: "Europe/Warsaw"
    groups:
      docker-base-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"

  - package-ecosystem: "gomod"
    directory: "/operator"
    schedule:
      interval: "daily"
      time: "06:27"
      timezone: "Europe/Warsaw"
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
